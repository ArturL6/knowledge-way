name: CI

# Minimal enforcement suite. The API and MCP tests need no external services
# (they build their own in-memory SQLite engines), and the web tests are pure
# unit tests, so every job is a plain checkout — no Postgres/Redis containers.
# Pytest is given an explicit tests path so collection is stable regardless of
# the runner's rootdir.

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest tests -q
        working-directory: apps/api

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/mcp/requirements.txt
      - run: python -m pytest tests -q
        working-directory: apps/mcp

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
