# Production override example; copy/edit paths outside this repository.
# docker compose -f docker-compose.yml -f compose.git-secrets.example.yml up
services:
  api:
    secrets:
      - git_deploy_key
      - git_known_hosts
      # For HTTPS instead, remove the SSH pair and enable git_https_token.
  worker:
    secrets:
      - git_deploy_key
      - git_known_hosts
secrets:
  git_deploy_key:
    file: /srv/knowledge-way-secrets/git_deploy_key
  git_known_hosts:
    file: /srv/knowledge-way-secrets/git_known_hosts
  # git_https_token:
  #   file: /srv/knowledge-way-secrets/git_https_token
