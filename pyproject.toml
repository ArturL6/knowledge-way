[project]
name = "knowledge-way"
version = "0.1.0"
description = "Self-hosted code intelligence and grounded AI code search"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "fastapi==0.115.6",
    "google-auth==2.40.3",
    "httpx==0.28.1",
    "openai==1.58.1",
    "pgvector==0.3.6",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "requests==2.32.5",
    "rq==2.0.0",
    "sqlalchemy==2.0.36",
    "tree-sitter==0.24.0",
    "tree-sitter-language-pack==0.3.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2.0"]
dev = ["import-linter==2.1.0", "pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/mcp/tests"]
pythonpath = ["apps/api", "apps/mcp"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on adapters"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = ["app.adapters"]

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on framework or infrastructure SDKs"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "tree_sitter",
    "tree_sitter_language_pack",
    "redis",
    "rq",
    "openai",
    "psycopg",
    "pgvector",
]

[dependency-groups]
dev = [
    "import-linter==2.1.0",
]
