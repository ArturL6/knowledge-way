# Every published port is bound to loopback. Redis runs with no password and RQ deserialises
# with pickle, so reaching 6379 from the network is remote code execution in the worker, which
# holds the PostgreSQL superuser DSN and a read-write host mount. Auth is KW-012; this is
# containment. Change a binding only behind a reverse proxy that terminates authentication.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledgeway
      POSTGRES_USER: knowledgeway
      POSTGRES_PASSWORD: knowledgeway
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./infra/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeway -d knowledgeway"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: alembic -c alembic.ini upgrade head
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/data", "${HOME}/.config/gcloud:/root/.config/gcloud:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: python -m app.worker
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes: ["./data:/data", "${HOME}/.config/gcloud:/root/.config/gcloud:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
    environment:
      # Browser requests use the published loopback address; SSR uses Docker DNS.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      API_INTERNAL_URL: http://api:8000/api
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
