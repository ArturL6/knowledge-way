services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledgeway
      POSTGRES_USER: knowledgeway
      POSTGRES_PASSWORD: knowledgeway
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./infra/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeway -d knowledgeway"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./apps/api
    command: python -m app.worker
    env_file: .env
    volumes: ["./data:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build: ./apps/web
    environment:
      # Browser requests use localhost; server-rendered Next.js requests use Docker DNS.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      API_INTERNAL_URL: http://api:8000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
